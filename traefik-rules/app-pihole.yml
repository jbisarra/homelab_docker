http:
  routers:
    pihole-rtr:
      rule: "Host(`pihole.{{env "DOMAINNAME"}}`)"
      entryPoints: 
        - websecure-internal
      middlewares:
        - chain-authelia@file
        - add-admin
      service: pihole-svc
      tls:
        certResolver: dns-cloudflare
        options: tls-opts@file
  middlewares:
    add-admin:
      #addPrefix:
      #  prefix: "/admin"
      redirectRegex:
        regex: "^http[s]?://([^/]*)[/]?$"
        replacement: "https://${1}/admin"
  services:
    pihole-svc:
      loadBalancer:
        servers:
          - url: "http://{{env "SERVER_LAN_IP"}}:82"

