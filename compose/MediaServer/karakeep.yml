services:
  karakeep:
    image: ghcr.io/karakeep-app/karakeep:release
    container_name: karakeep
    restart: unless-stopped
    volumes:
      # By default, the data is stored in a docker volume called "data".
      # If you want to mount a custom directory, change the volume mapping to:
      # - /path/to/your/directory:/data
      - $DOCKERDIR/appdata/karakeep:/data
    ports:
      - ${KARAKEEP_PORT}:3000
    environment:
      MEILI_ADDR: http://kkp-meilisearch:7700
      BROWSER_WEB_URL: http://kkp-chrome:9222
      NEXTAUTH_URL: https://karakeep.vzlabmux.com
      NEXTAUTH_SECRET: g5/ub63QqqTuX7pgjdLHDCMIlVSxjfelJhfBXfdmKn6VXRfI
      MEILI_MASTER_KEY: $MEILI_KEY
      # OPENAI_API_KEY: ...

      # You almost never want to change the value of the DATA_DIR variable.
      # If you want to mount a custom directory, change the volume mapping above instead.
      DATA_DIR: /data # DON'T CHANGE THIS
  chrome: #for headless browsing
    image: gcr.io/zenika-hub/alpine-chrome:124
    container_name: kkp-chrome
    restart: unless-stopped
    command:
      - --no-sandbox
      - --disable-gpu
      - --disable-dev-shm-usage
      - --remote-debugging-address=0.0.0.0
      - --remote-debugging-port=9222
      - --hide-scrollbars
  meilisearch: #search engine
    image: getmeili/meilisearch:v1.13.3
    container_name: kkp-meilisearch
    restart: unless-stopped
    environment:
      MEILI_NO_ANALYTICS: "true"
      MEILI_MASTER_KEY: $MEILI_KEY
    volumes:
      - $DOCKERDIR/appdata/meilisearch:/meili_data


