services:
  freshrss:
    image: lscr.io/linuxserver/freshrss:latest
    container_name: freshrss
    security_opt:
      - no-new-privileges:true
    restart: "always"
    profiles: ["news", "all"]
    networks:
      - default
    ports:
      - "$FRESHRSS_PORT:80"
    volumes:
      - ${DOCKERDIR}/appdata/freshrss:/config
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
