services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    security_opt:
      - no-new-privileges:true
    restart: "unless-stopped"
    profiles: ["core", "all"]
    networks:
      - default
    ports:
      - "$VAULTWARDEN_PORT:80"
    volumes:
      - ${DOCKERDIR}/appdata/vaultwarden:/data
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      DOMAIN: "https://vaultwarden.vzlabmux.org"
