services:
  # Nextcloud - Cloud Document Manager
  nextcloud:
    image: nextcloud:latest
    container_name: nextcloud
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
      #user: "$PUID:$PGID"
    networks:
      - default
    depends_on:
      - nextcloud_db
      - redis
    ports:
      - $NEXTCLOUD_PORT:80
    volumes: 
      - $DOCKERDIR/appdata/nextcloud:/var/www/html
      - $MEDIADIR/Documents/nextcloud:/var/www/html/data
        #- $DOCKERDIR/appdata/nextcloud/redis_session:/usr/local/etc/php/conf.d/
        #- /tmp/data:/var/www/html/data
    secrets:
      - nextcloud_mariadb_password
      - nextcloud_admin_password
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      MYSQL_HOST: mariadb
      MYSQL_PASSWORD_FILE: /run/secrets/nextcloud_mariadb_password
      MYSQL_DATABASE: db-nextcloud 
      MYSQL_USER: nc-user
      REDIS_HOST: redis
        #REDIS_PORT: $REDIS_PORT
      NEXTCLOUD_ADMIN_USER: hueylaforet
      NEXTCLOUD_ADMIN_PASSWORD_FILE: /run/secrets/nextcloud_admin_password
        #NEXTCLOUD_DATA_DIR: /var/www/html/data
        #TRUSTED_PROXIES: 192.168.0.0/24
