services:
  # Nextcloud - Cloud Document Manager
  nextcloud:
    image: nextcloud:latest
    container_name: nextcloud
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - default
    depends_on:
      - mariadb
      - redis
    ports:
      - $NEXTCLOUD_PORT:80
    volumes: 
      - $DOCKERDIR/appdata/nextcloud:/var/www/html
        #- $MEDIADIR/Documents/nextcloud:/data
      - /tmp/data:/data
    secrets:
      - nextcloud_mariadb_password
      - nextcloud_admin_password
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      MYSQL_HOST: mariadb
      MYSQL_PASSWORD_FILE: /run/secrets/nextcloud_mariadb_password
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      REDIS_HOST: redis
      NEXTCLOUD_ADMIN_USER: hueylaforet
      NEXTCLOUD_ADMIN_PASSWORD_FILE: /run/secrets/nextcloud_admin_password
      NEXTCLOUD_DATA_DIR: /data
        #TRUSTED_PROXIES: 192.168.0.0/24
